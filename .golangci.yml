version: "2"

run:
  timeout: 5m

linters:
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - gocritic
    - gosec
  exclusions:
    rules:
      - path: _test\.go
        linters: [errcheck, gosec]
      - path: internal/pipes/fidelity_test\.go
        linters: [gosec]

issues:
  max-issues-per-linter: 50
  max-same-issues: 3
